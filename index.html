<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intellion Lead Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">

      <div><b>Intellion</b><small>Lead Desk</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Signed in as
      <select id="role">
        <option value="admin">Admin · Priya Nair</option>
        <option value="head">Regional Head · Rohit Sethi</option>
        <option value="exec">Sales Exec · Ananya Rao</option>
      </select>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="btn menu-btn" id="menu">☰</button>
      <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
      <div class="spacer"></div>
      <span class="live"><i></i> Live</span>
      <button class="btn primary sm" id="simulate">+ Simulate new lead</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="drawer-bg" id="drawerBg"><aside class="drawer" id="drawer"></aside></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
